name: Idea or new automation type
description: Something you'd like Flowhaus to map, show or do
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What are you trying to see or do?
      description: The automation you run (what it does, where it runs) is the most useful context.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
