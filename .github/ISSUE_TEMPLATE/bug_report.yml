name: Bug report
description: Something doesn't work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thanks! Please don't paste keys, tokens or personal data. For security issues, use private vulnerability reporting instead (see SECURITY.md)."
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      description: Commands you ran, the page you were on, the automation type (github_actions, folder_runs, python).
  - type: textarea
    id: doctor
    attributes:
      label: Output of `uv run flowhaus doctor`
      render: text
  - type: input
    id: os
    attributes:
      label: Operating system and browser
