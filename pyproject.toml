[project]
name = "flowhaus"
version = "0.1.0"
description = "See your automations as a plain-English map: what came in, what came out, what was skipped and why."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.160",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
    "sf-hamilton>=1.90.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
flowhaus = "server.cli:main"

[dependency-groups]
dev = ["pytest>=9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server", "connectors", "pipeline"]

[tool.hatch.build.targets.wheel.force-include]
"flowkit.py" = "flowkit.py"

[tool.hatch.build]
dev-mode-dirs = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
